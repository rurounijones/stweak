---
includes:
  - lib
requires:
  - stweak
  # The gem's entrypoint (require 'stweak') loads the domain and the ports but
  # never an adapter, by the explicit-requires rule: an adapter is reached only
  # by the file that uses it. Mutant discovers subjects from loaded constants,
  # so a gem adapter has to be named here to be mutated. Every adapter under
  # lib/ is bar-held gem code and is required explicitly for that reason.
  - stweak/adapters/checkpoint_store/in_memory
  - stweak/adapters/encryption/aes_gcm
  - stweak/adapters/event_store/encrypting
  - stweak/adapters/event_store/in_memory
  - stweak/adapters/event_subscription/in_memory
  - stweak/adapters/key_store/in_memory
  - stweak/adapters/projection_store/in_memory
  - stweak/adapters/security/pbkdf2_password_hasher
integration:
  name: rspec
matcher:
  subjects:
    - Stweak*
  # Port and abstract methods are declarations, not behaviour: their bodies are
  # never executed (subclasses and implementors provide the real methods), so
  # no test can pin them and no mutation of them can be killed. Mutating them
  # would only ever produce false positives. Projection#name is abstract too,
  # and its test pins Sorbet's runtime NotImplementedError stub; mutant
  # reinserts the body without the `sig`, which drops that stub, so even the
  # neutral mutation fails. Account#id is the same shape in a
  # different form: its body is a T.cast that narrows the inherited Id to
  # AccountId — a type annotation with no runtime behaviour, so removing it is
  # behaviourally identical and no test can tell the difference. The
  # initializer below is an annotation too: its T.let declares the type of an
  # empty collection, and mutating the type parameter leaves the runtime value
  # identical, so no test can tell the difference. ProjectionSystem#stream_key
  # interpolates an aggregate class, whose #to_s is its name, so dropping the
  # explicit #name is behaviourally identical and no test can tell the
  # difference. Pbkdf2PasswordHasher#random_salt is the same shape: its body is
  # one call to a CSPRNG for 16 bytes, and its only surviving mutants swap that
  # source for an equivalent one (OpenSSL::Random for the plain Random that
  # securerandom, loaded in the mutation env, also answers; or the explicit 16
  # for random_bytes' own 16-byte default). No test can distinguish two secure
  # sources of 16 random bytes, so it is isolated into its own method — keeping
  # #digest fully mutated — and ignored here.
  #
  # The adapter entries below are the same two shapes. The in-memory stores'
  # initializers (CheckpointStore, KeyStore, ProjectionStore, EventSubscription)
  # are T.let annotations on empty collections, exactly like the domain
  # initializer above. AesGcm#random_key_bytes
  # is Pbkdf2PasswordHasher#random_salt's twin: one CSPRNG call for 32 bytes
  # whose only survivors swap the secure source for the equivalent plain Random,
  # isolated so #generate_key — which wraps the bytes in an EncryptionKey — stays
  # fully mutated. Ciphertext#segments holds the negative-limit split ('.', -1)
  # whose survivors are equivalent — any negative limit is unlimited, so no test
  # can tell -1 from -2 — isolated to keep #decode's length guard fully mutated.
  #
  # The remaining adapter entries hold survivors that no single-threaded,
  # assertion-based test can kill, each isolated so the method it is ignored
  # with carries nothing else. AesGcm#new_decipher's #decrypt call sets decrypt
  # mode, but this OpenSSL builds a working GCM decipher from the key, iv and tag
  # alone, so dropping it leaves the round trip identical and no test can tell;
  # the algorithm name is pinned on the encrypt side. The in-memory event store's
  # #write, #read_stream and #each_stream are thin wrappers around
  # @mutex.synchronize: dropping the lock changes nothing a single-threaded test
  # observes, and #read_stream and EncryptingEventStore#read_stream additionally
  # carry the equivalent +after: 0+ default (one-based sequences make any
  # negative bound identical); the real read, write and iteration logic lives in
  # fully-mutated helpers. EncryptingEventStore#persist carries the
  # @store.append → self recursion that the strict coverage criteria record as a
  # timeout, not a killed assertion.
  ignore:
    - Stweak::Adapters::CheckpointStore::InMemoryCheckpointStore#initialize
    - Stweak::Adapters::Encryption::AesGcm#new_decipher
    - Stweak::Adapters::Encryption::AesGcm#random_key_bytes
    - Stweak::Adapters::Encryption::Ciphertext#segments
    - Stweak::Adapters::EventStore::EncryptingEventStore#persist
    - Stweak::Adapters::EventStore::EncryptingEventStore#read_stream
    - Stweak::Adapters::EventStore::InMemoryEventStore#each_stream
    - Stweak::Adapters::EventStore::InMemoryEventStore#read_stream
    - Stweak::Adapters::EventStore::InMemoryEventStore#write
    - Stweak::Adapters::EventSubscription::InMemoryEventSubscription#initialize
    - Stweak::Adapters::KeyStore::InMemoryKeyStore#initialize
    - Stweak::Adapters::ProjectionStore::InMemoryProjectionStore#initialize
    - Stweak::Adapters::Security::Pbkdf2PasswordHasher#random_salt
    - Stweak::Domain::Accounts::Account#id
    - Stweak::Domain::Aggregate#apply
    - Stweak::Domain::Aggregate#checkpoint_state
    - Stweak::Domain::Aggregate#restore
    - Stweak::Domain::Event#type
    - Stweak::Domain::Event#version
    - Stweak::Domain::Event.from_h
    - Stweak::Domain::Projection#apply
    - Stweak::Domain::Projection#name
    - Stweak::Domain::Projection#reset
    - Stweak::Domain::ProjectionSystem#initialize
    - Stweak::Domain::ProjectionSystem#stream_key
    - Stweak::Domain::Security::PasswordHasher#digest
    - Stweak::Domain::Security::PasswordHasher#verify
    - Stweak::Ports::CheckpointStore#delete
    - Stweak::Ports::CheckpointStore#get
    - Stweak::Ports::CheckpointStore#put
    - Stweak::Ports::EventStore#append
    - Stweak::Ports::EventStore#each_stream
    - Stweak::Ports::EventStore#read_stream
    - Stweak::Ports::EventStoreListener#on_events_appended
    - Stweak::Ports::EventSubscription#publish
    - Stweak::Ports::EventSubscription#register
    - Stweak::Ports::KeyStore#delete
    - Stweak::Ports::KeyStore#get
    - Stweak::Ports::KeyStore#put
    - Stweak::Ports::ProjectionStore#clear
    - Stweak::Ports::ProjectionStore#delete
    - Stweak::Ports::ProjectionStore#delete_row
    - Stweak::Ports::ProjectionStore#read
    - Stweak::Ports::ProjectionStore#read_all
    - Stweak::Ports::ProjectionStore#read_row
    - Stweak::Ports::ProjectionStore#upsert
    - Stweak::Ports::ProjectionStore#write
    - Stweak::Ports::Usernames#include?
coverage_criteria:
  timeout: false
  process_abort: false
  test_result: true
mutation:
  # `light` is mutant's own default operator set. `full` additionally swaps
  # `==` for `eql?` (and `first` for `last`), which for value objects built
  # from strings and hashes is behaviourally equivalent and therefore
  # unkillable — noise rather than a signal that behaviour is unconstrained.
  operators: light
