---
includes:
  - lib
requires:
  - stweak
integration:
  name: rspec
matcher:
  subjects:
    - Stweak*
  # Port and abstract methods are declarations, not behaviour: their bodies are
  # never executed (subclasses and implementors provide the real methods), so
  # no test can pin them and no mutation of them can be killed. Mutating them
  # would only ever produce false positives. Account#id is the same shape in a
  # different form: its body is a T.cast that narrows the inherited Id to
  # AccountId — a type annotation with no runtime behaviour, so removing it is
  # behaviourally identical and no test can tell the difference. The
  # initializer below is an annotation too: its T.let declares the type of an
  # empty collection, and mutating the type parameter leaves the runtime value
  # identical, so no test can tell the difference. ProjectionSystem#stream_key
  # interpolates an aggregate class, whose #to_s is its name, so dropping the
  # explicit #name is behaviourally identical and no test can tell the
  # difference.
  ignore:
    - Stweak::Domain::Accounts::Account#id
    - Stweak::Domain::Aggregate#apply
    - Stweak::Domain::Aggregate#checkpoint_state
    - Stweak::Domain::Aggregate#restore
    - Stweak::Domain::Event#type
    - Stweak::Domain::Event#version
    - Stweak::Domain::Event.from_h
    - Stweak::Domain::Projection#apply
    - Stweak::Domain::Projection#reset
    - Stweak::Domain::ProjectionSystem#initialize
    - Stweak::Domain::ProjectionSystem#stream_key
    - Stweak::Domain::Security::PasswordHasher#digest
    - Stweak::Domain::Security::PasswordHasher#verify
    - Stweak::Ports::CheckpointStore#delete
    - Stweak::Ports::CheckpointStore#get
    - Stweak::Ports::CheckpointStore#put
    - Stweak::Ports::EventStore#append
    - Stweak::Ports::EventStore#each_stream
    - Stweak::Ports::EventStore#read_stream
    - Stweak::Ports::EventStoreListener#on_events_appended
    - Stweak::Ports::EventSubscription#publish
    - Stweak::Ports::EventSubscription#register
    - Stweak::Ports::KeyStore#delete
    - Stweak::Ports::KeyStore#get
    - Stweak::Ports::KeyStore#put
    - Stweak::Ports::ProjectionStore#clear
    - Stweak::Ports::ProjectionStore#delete
    - Stweak::Ports::ProjectionStore#delete_row
    - Stweak::Ports::ProjectionStore#read
    - Stweak::Ports::ProjectionStore#read_all
    - Stweak::Ports::ProjectionStore#read_row
    - Stweak::Ports::ProjectionStore#upsert
    - Stweak::Ports::ProjectionStore#write
    - Stweak::Ports::Usernames#include?
coverage_criteria:
  timeout: false
  process_abort: false
  test_result: true
mutation:
  # `light` is mutant's own default operator set. `full` additionally swaps
  # `==` for `eql?` (and `first` for `last`), which for value objects built
  # from strings and hashes is behaviourally equivalent and therefore
  # unkillable — noise rather than a signal that behaviour is unconstrained.
  operators: light
