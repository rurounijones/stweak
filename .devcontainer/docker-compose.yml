# The development environment as a compose stack: the dev container (built
# from Dockerfile, where the editor attaches) plus the three services the app
# area's real adapters need — DynamoDB Local for the event store, ElasticMQ
# for the subscription, and Redis for the checkpoint and key stores. SQLite
# needs no service (it is a file). The dev service mounts the workspace and the
# shared bundle volume, and its healthcheck-free lifecycle is kept alive by
# `sleep infinity` so the editor can attach.
name: stweak
services:
  dev:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/workspaces/stweak
      - stweak-bundle:/usr/local/bundle
    environment:
      BUNDLE_PATH: /usr/local/bundle
      # The services are sibling containers, reached by their compose service
      # names; CI reaches the same services on localhost, so the specs default
      # to localhost and these override within the dev container.
      AWS_ENDPOINT_URL: http://dynamodb-local:8000
      ELASTICMQ_URL: http://elasticmq:9324
      REDIS_URL: redis://redis:6379
    command: sleep infinity
    depends_on:
      dynamodb-local:
        condition: service_healthy
      elasticmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  dynamodb-local:
    image: amazon/dynamodb-local:latest
    # Published on 38000 to avoid clashing with anything the host may already
    # run on 8000; inside the compose network it is still reached as
    # dynamodb-local:8000, so the dev container and specs are unaffected.
    ports:
      - '38000:8000'
    # curl without -f: the local endpoint answers any HTTP request (even a
    # 400 for a GET), so a successful connection is enough to prove readiness.
    healthcheck:
      test: ['CMD-SHELL', 'curl -s -o /dev/null http://localhost:8000 || exit 1']
      interval: 5s
      timeout: 3s
      retries: 10

  elasticmq:
    image: softwaremill/elasticmq-native:latest
    # Published on 39324 to avoid clashing with anything the host may already
    # run on 9324; inside the compose network it is still reached as
    # elasticmq:9324, so the dev container and specs are unaffected.
    ports:
      - '39324:9324'
    # ElasticMQ answers only SQS requests (a plain GET is a 400), so readiness
    # is a TCP connect to the port, which the image's busybox nc provides.
    healthcheck:
      test: ['CMD', 'nc', '-z', 'localhost', '9324']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    # Published on 36379 to avoid clashing with anything the host may already
    # run on 6379; inside the compose network it is still reached as
    # redis:6379, so the dev container and specs are unaffected.
    ports:
      - '36379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # OpenObserve receives the drivers' OpenTelemetry traces. It is not needed by
  # the specs or the app-area adapters; only the drivers export to it, and only
  # when their .env names its endpoint, so it is off the default test path.
  openobserve:
    image: public.ecr.aws/zinclabs/openobserve:latest
    container_name: openobserve
    # Published on 35080 to avoid clashing with anything the host may already
    # run on 5080; inside the compose network it is still reached as
    # openobserve:5080, so the drivers' OTLP exporter is unaffected.
    ports:
      - '35080:5080'
    volumes:
      - /tmp/openobserve_data:/data
    environment:
      - ZO_ROOT_USER_EMAIL=root@example.com
      - ZO_ROOT_USER_PASSWORD=Root123!
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:5080/ || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  stweak-bundle:
