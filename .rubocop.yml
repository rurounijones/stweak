plugins:
  - rubocop-performance
  - rubocop-rake
  - rubocop-rspec
  - rubocop-sorbet
  - rubocop-thread_safety

AllCops:
  TargetRubyVersion: 3.4
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - 'sorbet/**/*'
    - 'vendor/**/*'

# Defaults are kept deliberately. Every disabled cop is an argument that the
# community default is wrong for this project, and the project should have to
# make that argument one cop at a time rather than inherit a list of them.
#
# The exceptions below are the deliberate few.

# Signatures sit between the doc comment and the method, which this cop reads
# as a missing blank line. rubocop-sorbet's own guidance is to allow it.
Layout/EmptyLineBetweenDefs:
  AllowAdjacentOneLineDefs: true

# The gemspec description is a heredoc, which this cop cannot see the end of.
Metrics/BlockLength:
  Exclude:
    - '*.gemspec'
    - 'spec/**/*_spec.rb'

# The app area keeps each bundle's specs in that bundle's own spec/ directory,
# because each driver is a separate application with its own bundle. The spec
# path therefore reflects the bundle, not the class namespace, and the cop's
# path-mirrors-namespace rule cannot hold there.
RSpec/SpecFilePathFormat:
  Exclude:
    - 'app/**/spec/**/*'

# The owner registry's @owners map is populated once as the event files are
# required and only read afterwards, never mutated at runtime, so the shared
# mutable state this cop guards against does not arise here.
ThreadSafety/ClassInstanceVariable:
  Exclude:
    - 'lib/stweak/domain/owner_registry.rb'
